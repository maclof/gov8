# Windows amd64 CI for gov8.
#
# Builds the pinned V8 shim with scripts/setup_windows.ps1, then runs the
# exact same gate set as scripts/verify_windows.ps1 (the single source of
# truth for local/CI parity):
#
#   go gate     gofmt check, go vet ./..., all Go tests, all conformance
#               suites, and go test -race ./... where the runner supports it
#               (windows-latest ships mingw, so CGO/-race works there; the
#               gate script probes and reports a precise skip otherwise).
#   rust gate   cargo fmt --check / check --locked / clippy (warnings denied)
#               / test --locked on the pinned 1.98.0 toolchain.
#   bench gate  benchmark smoke: every benchmark compiled and run once.
#               This validates executability only - no performance numbers
#               from CI are published or compared as evidence.
#
# Cache policy: every actions/cache step uses an exact content-derived key
# (pinned SHA-256 literals for the V8 downloads, hashFiles() over lockfiles
# and sources for build products) and deliberately sets NO restore-keys, so a
# cache entry can never be reused when the inputs it was built from changed.
# Restored artifact/crate bytes are re-verified against the pinned SHA-256
# digests by setup_windows.ps1, which fails closed on any mismatch. Only
# downloads and build products are cached - never fixtures or test results.

name: windows-amd64

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-amd64-${{ github.ref }}
  cancel-in-progress: true

env:
  GOV8_GO_VERSION: '>=1.24.0'
  GOV8_RUST_TOOLCHAIN: '1.98.0'
  GOV8_V8_CRATE_VERSION: '152.2.0'
  # Pinned download digests (see scripts/setup_windows.ps1 and
  # rust-oracle/README.md; setup re-verifies every byte it loads).
  GOV8_ARTIFACT_SHA: '0b17ca072bae37dd4ff00e6014d2b413becb031c9342ee11cb8226a5881f62b2'
  GOV8_CRATE_SHA: 'a10fe1a92da5c32c7c7f838ce36c0ccfcfd5edf0865b58bdde820aa64cea9888'

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: windows-amd64 verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go (1.24 or newer)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOV8_GO_VERSION }}
          check-latest: true

      - name: Install pinned Rust toolchain (${{ env.GOV8_RUST_TOOLCHAIN }})
        run: rustup toolchain install $env:GOV8_RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc; rustup default $env:GOV8_RUST_TOOLCHAIN; rustc --version

      - name: Verify Visual Studio MSVC C++ tools are available
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere.exe not found; the runner image must include Visual Studio with the C++ build tools.'
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with MSVC C++ tools (VC.Tools.x86.x64) found.' }
          Write-Host "MSVC installation: $vs"

      # --- hash-keyed caches (exact keys only, no restore-keys) ---------------
      - name: Cache pinned V8 downloads (artifact, crate, extracted headers)
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: gov8-thirdparty-v1-${{ env.GOV8_ARTIFACT_SHA }}-${{ env.GOV8_CRATE_SHA }}

      - name: Cache rusty_v8 cargo artifact cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/.rusty_v8
          key: gov8-rusty-v8-archive-v1-${{ env.GOV8_ARTIFACT_SHA }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: gov8-cargo-registry-v1-${{ hashFiles('rust-oracle/Cargo.lock', 'internal/shim/temporal/Cargo.lock') }}

      - name: Cache temporal helper crate build products
        uses: actions/cache@v4
        with:
          path: build/temporal-target
          key: gov8-temporal-target-v1-${{ hashFiles('internal/shim/temporal/Cargo.lock', 'internal/shim/temporal/Cargo.toml', 'internal/shim/temporal/src/**') }}

      - name: Cache rust-oracle build products
        uses: actions/cache@v4
        with:
          path: rust-oracle/target
          key: gov8-oracle-target-v1-${{ hashFiles('rust-oracle/Cargo.lock', 'rust-oracle/Cargo.toml', 'rust-oracle/rust-toolchain.toml') }}

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/go-build
          key: gov8-go-build-v1-${{ hashFiles('go.mod', '**/*.go') }}

      # --- build + gates ------------------------------------------------------
      - name: Set up pinned V8 inputs and build shim DLL
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_windows.ps1

      - name: Go gates (gofmt, vet, tests, race, conformance suites)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_windows.ps1 -Gates go

      - name: Rust gates (fmt, check, clippy, test)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_windows.ps1 -Gates rust

      - name: Benchmark smoke (single pass, no performance claims)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify_windows.ps1 -Gates bench
